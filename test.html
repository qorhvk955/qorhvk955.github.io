<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>SVG Line Animation</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 300vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      svg {
        width: 300px;
        height: auto;
      }

      path {
        stroke: #4e9546;
        stroke-width: 2;
        fill: none;
      }
    </style>
  </head>
  <body>
    <section id="point">
      <svg viewBox="0 0 200 200">
        <path
          id="animatedPath"
          d="M10 80 C 40 10, 65 10, 95 80 S 150 150, 180 80"
        />
      </svg>
    </section>

    <script type="module">
      import { gsap } from "https://cdn.jsdelivr.net/npm/gsap@3.12.2/+esm";
      import { ScrollTrigger } from "https://cdn.jsdelivr.net/npm/gsap@3.12.2/ScrollTrigger.min.js";

      gsap.registerPlugin(ScrollTrigger);

      const path = document.querySelector("#animatedPath");
      const length = path.getTotalLength();

      // 초기 세팅
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;

      // 애니메이션
      gsap.to(path, {
        strokeDashoffset: 0,
        duration: 2,
        ease: "power2.out",
        scrollTrigger: {
          trigger: "#point",
          start: "top center",
          toggleActions: "play none none none",
        },
      });
    </script>
  </body>
</html>
