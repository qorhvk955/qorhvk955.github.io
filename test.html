<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        margin: 0 auto;
      }
      .box1 {
        width: 300px;
        height: 300px;
        background-color: red;
        position: relative;
      }
      .box2 {
        width: 200px;
        height: 200px;
        background-color: orange;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .box2-inner {
        width: 200px;
        height: 200px;
        position: relative;
      }
      .box3-1 {
        width: 50px;
        height: 50px;
        background-color: yellow;
        position: absolute;
        top: 0%;
        left: 0%;
        transform: translate(-50%, -50%);
      }

      .box3-2 {
        width: 50px;
        height: 50px;
        position: absolute;
        top: 0%;
        right: 0%;

        background-color: green;
      }
      .box3-3 {
        width: 50px;
        height: 50px;
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="box1">
      <div class="box2">
        <div class="box2-inner">
          <div class="box3-1"></div>
          <div class="box3-2"></div>
          <div class="box3-3"></div>
          <div class="box3-4"></div>
        </div>
      </div>
    </div>
  </body>
</html>
