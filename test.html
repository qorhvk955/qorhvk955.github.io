<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Center with Flex</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 600px;
        height: 600px;
        background: #f8f8f8;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .bottle-outline {
        width: 120px;
        height: 360px;
      }

      .bottle-outline img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="bottle-outline">
        <img src="file/dotted_sauce_outline.png" alt="소스병 점선" />
      </div>
    </div>
  </body>
</html>
